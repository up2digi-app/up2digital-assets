    <!-- Javascript Logic -->
    <script>
        // --- CONSTANTS & STATE ---
        const DB_KEY_COMPANY = 'gasora_leave_company';
        const DB_KEY_REQUESTS = 'gasora_leave_requests';
        
        // DEMO LIMIT STANDARD
        const DEMO_LIMITS = {
            Employees: 5,
            LeaveRequests: 20
        };
        
        let company = {
            name: 'PT. UP2Digital Inovasi',
            address: 'Jl. Sudirman Kav 12, Jakarta Selatan',
            phone: '021-88899900'
        };
        
        let requests = [];
        let currentView = 'dashboard';

        // --- INITIALIZATION ---
        function init() {
            lucide.createIcons();
            loadData();
            checkDummyData();
            navigate('dashboard');
            updateBadge();
        }

        // --- DATA MANAGEMENT ---
        function loadData() {
            const storedCompany = localStorage.getItem(DB_KEY_COMPANY);
            if (storedCompany) company = JSON.parse(storedCompany);
            
            const storedReqs = localStorage.getItem(DB_KEY_REQUESTS);
            if (storedReqs) requests = JSON.parse(storedReqs);
        }

        function saveData() {
            localStorage.setItem(DB_KEY_COMPANY, JSON.stringify(company));
            localStorage.setItem(DB_KEY_REQUESTS, JSON.stringify(requests));
            updateBadge();
        }

        function checkDummyData() {
            if (!localStorage.getItem(DB_KEY_REQUESTS) || requests.length === 0) {
                generateDummyData();
            }
        }

        function generateDummyData() {
            // SEED DATA DEMO: 3 Karyawan, 10 Pengajuan (4 Menunggu, 4 Approved, 2 Rejected)
            const names = ['Andi Setiawan', 'Budi Santoso', 'Citra Lestari'];
            const types = ['Cuti Tahunan', 'Cuti Sakit', 'Izin'];
            
            const statusFlow = [
                'Menunggu Approval', 'Menunggu Approval', 'Menunggu Approval', 'Menunggu Approval',
                'Approved', 'Approved', 'Approved', 'Approved',
                'Rejected', 'Rejected'
            ];
            
            for (let i = 0; i < 10; i++) {
                let status = statusFlow[i];
                let noDoc = '';
                let catatan = '';

                if (status === 'Approved') { 
                    noDoc = `APP-2026-00${i+1}`; 
                    catatan = 'Disetujui oleh Manager.'; 
                } else if (status === 'Rejected') { 
                    catatan = 'Kuota cuti tidak cukup / operasional sibuk.'; 
                }

                const tglMulai = new Date(2026, 0, i + 5);
                const tglSelesai = new Date(2026, 0, i + 5 + (i%3));
                const jmlHari = Math.ceil((tglSelesai - tglMulai) / (1000 * 60 * 60 * 24)) + 1;

                requests.push({
                    id: generateUUID(),
                    no: `LV-${String(i+1).padStart(4, '0')}`,
                    nama: names[i % 3],
                    tglPengajuan: new Date(2026, 0, i+1).toISOString().split('T')[0],
                    jenis: types[i % 3],
                    tglMulai: tglMulai.toISOString().split('T')[0],
                    tglSelesai: tglSelesai.toISOString().split('T')[0],
                    jumlahHari: jmlHari,
                    alasan: `Keperluan ${types[i % 3]}`,
                    status: status,
                    noDoc: noDoc,
                    catatan: catatan
                });
            }
            saveData();
        }

        // --- HELPERS ---
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function generateNextNo() {
            if (requests.length === 0) return 'LV-0001';
            const numbers = requests
                .map(r => parseInt(r.no.replace('LV-', '')))
                .filter(n => !isNaN(n));
            const max = numbers.length > 0 ? Math.max(...numbers) : 0;
            return `LV-${String(max + 1).padStart(4, '0')}`;
        }

        function calculateDays(start, end) {
            if (!start || !end) return 0;
            const d1 = new Date(start);
            const d2 = new Date(end);
            if (d2 < d1) return 0;
            return Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
        }

        function formatDate(dateStr) {
            if(!dateStr) return '-';
            const options = { day: '2-digit', month: 'short', year: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        }

        function getStatusBadge(status) {
            if (status === 'Menunggu Approval') return `<span class="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-amber-100 text-amber-800 border border-amber-200">Menunggu</span>`;
            if (status === 'Approved') return `<span class="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-emerald-100 text-emerald-800 border border-emerald-200">Approved</span>`;
            if (status === 'Rejected') return `<span class="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-rose-100 text-rose-800 border border-rose-200">Rejected</span>`;
            return `<span>${status}</span>`;
        }

        function updateBadge() {
            const count = requests.filter(r => r.status === 'Menunggu Approval').length;
            const badge = document.getElementById('badge-approval');
            if (count > 0) {
                badge.innerText = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // --- NAVIGATION & VIEWS ---
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        function navigate(view) {
            currentView = view;
            
            // Update Active Nav (Desktop)
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white', 'text-amber-400');
                if(btn.id === 'nav-tools') {
                    btn.classList.add('text-amber-400');
                } else {
                    btn.classList.add('text-slate-300');
                }
            });
            const activeBtn = document.getElementById(`nav-${view}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-300', 'text-amber-400');
                activeBtn.classList.add('bg-primary', 'text-white');
            }

            const container = document.getElementById('view-container');
            
            if (view === 'dashboard') renderDashboard(container);
            else if (view === 'pengajuan') renderPengajuan(container);
            else if (view === 'approval') renderApproval(container);
            else if (view === 'riwayat') renderRiwayat(container);
            else if (view === 'profil') renderProfil(container);
            else if (view === 'tools') renderTools(container);

            lucide.createIcons();
        }

        // --- VIEWS RENDERERS ---

        function renderDashboard(container) {
            const total = requests.length;
            const waiting = requests.filter(r => r.status === 'Menunggu Approval').length;
            const approved = requests.filter(r => r.status === 'Approved').length;
            const rejected = requests.filter(r => r.status === 'Rejected').length;
            const cuti = requests.filter(r => r.jenis.includes('Cuti')).length;
            const izin = requests.filter(r => r.jenis.includes('Izin') || r.jenis === 'Lainnya').length;

            const terbaru = [...requests].sort((a,b) => new Date(b.tglPengajuan) - new Date(a.tglPengajuan)).slice(0,5);
            const waitingList = requests.filter(r => r.status === 'Menunggu Approval').sort((a,b) => new Date(b.tglPengajuan) - new Date(a.tglPengajuan)).slice(0,5);
            
            // Ranking
            const pemohonCount = {};
            requests.forEach(r => {
                pemohonCount[r.nama] = (pemohonCount[r.nama] || 0) + 1;
            });
            const topPemohon = Object.keys(pemohonCount)
                .map(nama => ({nama, total: pemohonCount[nama]}))
                .sort((a,b) => b.total - a.total)
                .slice(0,5);

            container.innerHTML = `
                <!-- Hero Perusahaan -->
                <div class="bg-gradient-to-r from-primary to-indigo-600 rounded-2xl p-6 md:p-8 text-white mb-6 shadow-lg relative overflow-hidden">
                    <div class="absolute right-0 top-0 opacity-10 transform translate-x-1/4 -translate-y-1/4">
                        <i data-lucide="building-2" class="w-64 h-64"></i>
                    </div>
                    <div class="relative z-10">
                        <h2 class="text-2xl md:text-3xl font-bold mb-2">${company.name}</h2>
                        <div class="flex flex-col md:flex-row gap-2 md:gap-6 text-indigo-100 text-sm">
                            <span class="flex items-center gap-2"><i data-lucide="map-pin" class="w-4 h-4"></i> ${company.address}</span>
                            <span class="flex items-center gap-2"><i data-lucide="phone" class="w-4 h-4"></i> ${company.phone}</span>
                        </div>
                    </div>
                </div>

                <!-- Summary Cards -->
                <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4 mb-6">
                    ${createStatCard('Total Pengajuan', total, 'file-text', 'text-blue-500', 'bg-blue-50')}
                    ${createStatCard('Menunggu', waiting, 'clock', 'text-amber-500', 'bg-amber-50')}
                    ${createStatCard('Approved', approved, 'check-circle', 'text-emerald-500', 'bg-emerald-50')}
                    ${createStatCard('Rejected', rejected, 'x-circle', 'text-rose-500', 'bg-rose-50')}
                    ${createStatCard('Total Cuti', cuti, 'calendar', 'text-purple-500', 'bg-purple-50')}
                    ${createStatCard('Total Izin', izin, 'user-minus', 'text-cyan-500', 'bg-cyan-50')}
                </div>

                <!-- Widgets Grid -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Widget 1 -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5 z-10 relative">
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                            <h3 class="font-semibold text-slate-800">Pengajuan Terbaru</h3>
                            <button onclick="navigate('riwayat')" class="text-xs text-primary hover:underline">Lihat Semua</button>
                        </div>
                        <div class="space-y-3">
                            ${terbaru.length ? terbaru.map(r => `
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-slate-800">${r.nama}</p>
                                        <p class="text-xs text-slate-500">${r.jenis} • ${r.jumlahHari} Hari</p>
                                    </div>
                                    ${getStatusBadge(r.status)}
                                </div>
                            `).join('') : '<p class="text-sm text-slate-400">Belum ada data</p>'}
                        </div>
                    </div>

                    <!-- Widget 2 -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5 z-10 relative">
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                            <h3 class="font-semibold text-slate-800">Menunggu Approval</h3>
                            <button onclick="navigate('approval')" class="text-xs text-amber-600 hover:underline">Proses</button>
                        </div>
                        <div class="space-y-3">
                            ${waitingList.length ? waitingList.map(r => `
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-slate-800">${r.nama}</p>
                                        <p class="text-xs text-slate-500">${formatDate(r.tglPengajuan)}</p>
                                    </div>
                                    <span class="text-xs font-semibold text-slate-700">${r.no}</span>
                                </div>
                            `).join('') : '<p class="text-sm text-slate-400">Tidak ada antrean</p>'}
                        </div>
                    </div>

                    <!-- Widget 3: Ranking -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5 z-10 relative">
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                            <h3 class="font-semibold text-slate-800 flex items-center gap-2">
                                <i data-lucide="trophy" class="w-4 h-4 text-amber-500"></i> Top Pemohon
                            </h3>
                        </div>
                        <div class="space-y-4">
                            ${topPemohon.length ? topPemohon.map((p, idx) => `
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <div class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-500">${idx+1}</div>
                                        <p class="text-sm font-medium text-slate-800">${p.nama}</p>
                                    </div>
                                    <span class="text-xs font-bold bg-primary/10 text-primary px-2 py-1 rounded">${p.total} Kali</span>
                                </div>
                            `).join('') : '<p class="text-sm text-slate-400">Belum ada data</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        function createStatCard(title, value, icon, iconColor, bgColor) {
            return `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4 relative z-10">
                    <div class="w-10 h-10 rounded-lg ${bgColor} flex items-center justify-center shrink-0">
                        <i data-lucide="${icon}" class="w-5 h-5 ${iconColor}"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 font-medium">${title}</p>

                        <label class="block text-sm font-medium text-slate-700 mb-1">Alasan / Keperluan <span class="text-rose-500">*</span></label>
                        <textarea id="frm-alasan" rows="2" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm bg-white">${data.alasan}</textarea>
                    </div>
                    <div class="pt-4 mt-2 flex justify-end gap-2 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium transition-colors">Batal</button>
                        <button type="submit" class="px-4 py-2 bg-primary hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition-colors">Simpan Data</button>
                    </div>
                </form>
            `;
            lucide.createIcons();
            openModal();
        }

        function calcHariForm() {
            const start = document.getElementById('frm-mulai').value;
            const end = document.getElementById('frm-selesai').value;
            const hari = calculateDays(start, end);
            document.getElementById('frm-hari').value = hari + ' Hari';
        }

        function saveDataPengajuan(e, idStr) {
            e.preventDefault();
            const id = idStr !== 'null' ? idStr : null;
            
            const start = document.getElementById('frm-mulai').value;
            const end = document.getElementById('frm-selesai').value;
            const hari = calculateDays(start, end);

            if(hari <= 0) { alert('Tanggal Selesai harus lebih besar atau sama dengan Tanggal Mulai.'); return; }

            const inputNama = document.getElementById('frm-nama').value.trim();

            // DEMO LIMIT CHECK (Employees validation)
            if (!id) {
                const uniqueNames = new Set(requests.map(r => r.nama.toLowerCase().trim()));
                if (!uniqueNames.has(inputNama.toLowerCase()) && uniqueNames.size >= DEMO_LIMITS.Employees) {
                    showDemoLimitModal();
                    return;
                }
            }

            const data = {
                nama: inputNama,
                jenis: document.getElementById('frm-jenis').value,
                tglMulai: start,
                tglSelesai: end,
                jumlahHari: hari,
                alasan: document.getElementById('frm-alasan').value
            };

            if (id) {
                // Update by primary key
                const index = requests.findIndex(r => r.id === id);
                if(index !== -1) {
                    requests[index] = { ...requests[index], ...data };
                }
            } else {
                // Insert
                requests.push({
                    id: generateUUID(),
                    no: generateNextNo(),
                    tglPengajuan: new Date().toISOString().split('T')[0],
                    status: 'Menunggu Approval',
                    noDoc: '',
                    catatan: '',
                    ...data
                });
            }

            saveData();
            closeModal();
            if(currentView === 'pengajuan') filterTable('pengajuan');
            else navigate(currentView);
        }

        function deleteData(id) {
            if(confirm('Yakin ingin menghapus data pengajuan ini?')) {
                // Delete By Primary Key (ID)
                requests = requests.filter(r => r.id !== id);
                saveData();
                if(currentView === 'pengajuan') filterTable('pengajuan');
                else navigate(currentView);
            }
        }

        // --- APPROVAL MODAL ---

            const req = requests.find(r => r.id === id);
            if(!req) return;

            document.getElementById('modal-content').innerHTML = `

                        <div class="col-span-2"><p class="text-slate-500 text-xs">Tanggal</p><p class="font-medium">${formatDate(req.tglMulai)} - ${formatDate(req.tglSelesai)}</p></div>
                        <div class="col-span-2"><p class="text-slate-500 text-xs">Alasan</p><p class="font-medium bg-white p-2 border border-blue-100 rounded mt-1">${req.alasan}</p></div>
                    </div>
                </div>
                <form onsubmit="submitApproval(event, '${id}')" class="p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Keputusan <span class="text-rose-500">*</span></label>
                        <select id="appr-keputusan" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm bg-white">
                            <option value="">-- Pilih Keputusan --</option>
                            <option value="Approved">Approve (Setujui)</option>
                            <option value="Rejected">Reject (Tolak)</option>

                    </div>
                    <div>

                        <input type="text" id="appr-nodoc" placeholder="Contoh: APP-2026-001" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm bg-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Catatan Approval (Opsional)</label>
                        <textarea id="appr-catatan" rows="2" placeholder="Catatan dari atasan..." class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm bg-white"></textarea>
                    </div>
                    <div class="pt-4 mt-2 flex justify-end gap-2 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium transition-colors">Batal</button>
                        <button type="submit" class="px-4 py-2 bg-primary hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition-colors">Simpan Keputusan</button>
                    </div>
                </form>
            `;
            lucide.createIcons();
            openModal();
        }

        function submitApproval(e, id) {
            e.preventDefault();
            const status = document.getElementById('appr-keputusan').value;
            const noDoc = document.getElementById('appr-nodoc').value;
            const catatan = document.getElementById('appr-catatan').value;

            const index = requests.findIndex(r => r.id === id);
            if(index !== -1) {
                requests[index].status = status;
                requests[index].noDoc = noDoc;
                requests[index].catatan = catatan;
                saveData();
                closeModal();
                navigate('approval');
            }
        }

        // --- EXPORT CSV (PREMIUM LOCKED - JANGAN DIJALANKAN, JANGAN DIHAPUS) ---
        function exportCSV() {
            let csvContent = "UP2 Cuti & Izin Lite v1.0\n";
            csvContent += `Nama Perusahaan,${company.name}\n`;
            csvContent += `Alamat,${company.address.replace(/,/g, ' ')}\n`;
            csvContent += `Telepon,${company.phone}\n`;
            csvContent += `Tanggal Export,${formatDate(new Date().toISOString())}\n\n`;
            
            // Header
            csvContent += "Nomor Pengajuan,Nama Karyawan,Tanggal Pengajuan,Jenis Pengajuan,Tanggal Mulai,Tanggal Selesai,Jumlah Hari,Status,Nomor Dokumen Approval,Catatan Approval\n";
            
            // Data Rows (Excluding Internal ID)
            const sortedData = [...requests].sort((a,b) => new Date(b.tglPengajuan) - new Date(a.tglPengajuan));
            
            sortedData.forEach(r => {
                const row = [
                    r.no,
                    `"${r.nama}"`,
                    r.tglPengajuan,
                    r.jenis,
                    r.tglMulai,
                    r.tglSelesai,
                    r.jumlahHari,
                    r.status,
                    `"${r.noDoc || '-'}"`,
                    `"${r.catatan || '-'}"`
                ];
                csvContent += row.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Export_Cuti_Izin_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initialize App
        window.onload = init;
